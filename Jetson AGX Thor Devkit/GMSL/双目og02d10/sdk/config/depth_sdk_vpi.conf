# depth_sdk 运行时配置 —— Jetson AGX Thor (P4071 + P3834 解串板, J20)
#
# 与 Orin NX 版的差异：
#   - 相机节点用 /dev/video0(0x30,VC1) / /dev/video1(0x20,VC0)；
#   - 校正后端用 VIC（VPI 4.1.4，/opt/nvidia/vpi4），CPU 路径保留为回退；
#   - engine 由本机 Thor 上的 trtexec 构建：las2_m_768x512_thor_fp16.engine
#     （FP16，512x768）。旧 las2_m_768x512_fp16.engine 是跨设备 plan（加载时
#     TRT 会警告 “across different models of devices”），实测两者推理耗时相同，
#     但本机 plan 受官方支持，留着旧文件作回退。
#
# 格式：每行 `key = value`；`#` 起注释。

# ---------------------------------------------------------------
# 相机（源）
# ---------------------------------------------------------------
camera.uri         = v4l2:///dev/video0,/dev/video1
# 已启用解串器内部 30Hz FSYNC（GMSL2 GPIO ID 8），双目时间戳差约 4 ms。
camera.max_pair_skew_ms = 15
camera.capture_timeout_ms = 1000
camera.width       = 1920
camera.height      = 1280
camera.fps         = 30
camera.format      = yuv422

# ---------------------------------------------------------------
# 标定（源分辨率 1920x1280 下测得）
# ---------------------------------------------------------------
calib.fx           = 507.979
calib.fy           = 507.979
calib.cx           = 930.528
calib.cy           = 649.949
calib.baseline_m   = 0.05955

# 鱼眼去畸变 + 极线校正。
#   vpi：VIC 硬件校正（YUYV→NV12→remap 全在 VIC 上），remap 直接输出到下面的
#        output_width/height（= 模型/推流尺寸），不再先出 1920x1280 再由 CPU 缩图。
#        彩色 JPEG 由 NVJPG 硬件编码（nvjpegEncodeImage，见 uvdp_streamer.cpp 的
#        NvJpegEncoder），CPU 只剩 RGBx→RGB 去 alpha 和一次 H2D 拷贝。
#        需要 build_vpi（-DBUILD_WITH_NVBUF=ON -DBUILD_WITH_VPI=ON）。
#        实测 10fps 深度 + 30fps 彩色：进程 0.6/14 核，彩色能跑满 30fps，
#        enc≈5 ms/job（OpenCV/TBB 路径是 17.5 ms、整进程 2.6 核）。
#   cpu：OpenCV fisheye remap（TBB 并行），同场景 6.1/14 核，彩色掉到 26-28fps。
#        仅作为 VPI 不可用时的回退（该路径仍按源分辨率校正，再在推流时缩放）。
#
# 注意：修正后的输出尺寸会通过 V4L2StereoSource::intrinsics() 按比例告知引擎，
#       所以 fx/cx 等标定值仍按源分辨率写，不要在这里手工换算。
rectify.enabled    = true
rectify.backend    = vpi
rectify.calibration_file = /home/nvidia/depth_sdk/config/stereo_calibration.json
rectify.output_width  = 768
rectify.output_height = 512

# ---------------------------------------------------------------
# 模型
# ---------------------------------------------------------------
model.engine     = /home/nvidia/depth_sdk/models/las2_m_768x512_thor_fp16.engine
model.input_width  = 768
model.input_height = 512
# 深度只要 10fps（彩色仍按相机 30fps 出）。实测：深度稳定 9.9-10.1fps，
# VIC 校正 + NVJPG 编码下进程 CPU 0.6/14 核（彩色 30fps 同时在线）。
# 注意别写成 30：相机本身 30fps，限速周期与帧周期相等时抖动会误杀约 1/3 的帧，
# 实测深度从 30fps 掉到 ~20fps（submits 19.4/s 而 busy=0 就是这个原因）。
# 0 = 不限速（相机帧率天然封顶，深度 30fps 时 GPU 占空比 ~45%）。
model.max_fps = 10

# ---------------------------------------------------------------
# 管线
# ---------------------------------------------------------------
stream.drop_while_busy   = true
stream.frame_queue_depth = 1

# ---------------------------------------------------------------
# ROS 发布
# ---------------------------------------------------------------
# 发布与 depth 同域（768x512、已去畸变+极线校正）的彩色，供后端把颜色
# 投影到深度点云。默认关闭，ROS 部署时显式打开。
color.publish_rectified = true
